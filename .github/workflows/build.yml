name: Build IPK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run native
      # package, not build: CI ships the version that was tagged instead of bumping it
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: |
            dist/*.ipk
            dist/*.manifest.json
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipk
            dist/*.manifest.json
